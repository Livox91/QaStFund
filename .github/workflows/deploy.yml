name: Deploy Production to EC2

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - master

jobs:
  deploy:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "$HOME/QaStFund"

            # 1. Update to the revision that passed CI
            git fetch origin master
            git checkout master
            git merge --ff-only ${{ github.event.workflow_run.head_sha }}

            # 2. Start the database first so it is ready for migrations
            docker compose -f compose.production.yaml --env-file deploy/.env.production up -d database

            # 3. Build the migrator from this revision, then apply its migrations
            docker compose -f compose.production.yaml --env-file deploy/.env.production --profile tools run --rm --build migrate

            # 4. Build and start the Next.js app, scheduler, and Caddy reverse proxy
            docker compose -f compose.production.yaml --env-file deploy/.env.production up -d --build

            # 5. Clean up old unused Docker images to save disk space on EC2
            docker image prune -f
