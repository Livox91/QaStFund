name: Deploy Production to EC2

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - master

jobs:
  deploy:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "$HOME/QaStFund"

            # 1. Update to the revision that passed CI
            git fetch origin master
            git checkout master
            git merge --ff-only ${{ github.event.workflow_run.head_sha }}

            # Authentication for dependency diagnostics is mandatory. Validate
            # it before mutating any running service, without printing its value.
            health_secret="$(sed -n 's/^OPERATIONAL_HEALTH_SECRET=//p' deploy/.env.production | tail -n 1 | tr -d '\r')"
            if [ "${#health_secret}" -lt 32 ]; then
              echo "OPERATIONAL_HEALTH_SECRET is missing or shorter than 32 characters on the target host." >&2
              exit 1
            fi
            unset health_secret

            # 2. Preserve the currently deployed application images for rollback,
            # then reclaim build cache without deleting the rollback artifacts.
            if docker image inspect qastfund-app:current >/dev/null 2>&1; then
              docker tag qastfund-app:current qastfund-app:rollback
            elif docker image inspect p2p-lending-app:latest >/dev/null 2>&1; then
              docker tag p2p-lending-app:latest qastfund-app:rollback
            fi
            if docker image inspect qastfund-reconciliation-scheduler:current >/dev/null 2>&1; then
              docker tag qastfund-reconciliation-scheduler:current qastfund-reconciliation-scheduler:rollback
            elif docker image inspect p2p-lending-reconciliation-scheduler:latest >/dev/null 2>&1; then
              docker tag p2p-lending-reconciliation-scheduler:latest qastfund-reconciliation-scheduler:rollback
            fi
            docker builder prune --all --force

            # 3. Start the database first so it is ready for migrations
            docker compose -f compose.production.yaml --env-file deploy/.env.production up -d database

            # 4. Build the migrator from this revision, then apply its migrations
            docker compose -f compose.production.yaml --env-file deploy/.env.production --profile tools run --rm --build migrate

            # 5. Build and start the Next.js app, scheduler, and Caddy reverse proxy
            docker compose -f compose.production.yaml --env-file deploy/.env.production up -d --build

            # Caddy does not automatically reload a changed bind-mounted Caddyfile.
            # Recreate it on every release, then validate the exact mounted config.
            docker compose -f compose.production.yaml --env-file deploy/.env.production up -d --force-recreate caddy
            docker compose -f compose.production.yaml --env-file deploy/.env.production exec -T caddy caddy validate --config /etc/caddy/Caddyfile
            docker compose -f compose.production.yaml --env-file deploy/.env.production images

            # Run external HTTPS probes without printing credentials or bodies.
            docker compose -f compose.production.yaml --env-file deploy/.env.production exec -T app node --input-type=module - < scripts/testing/verify-edge-security.mjs

            # 6. Clean up dangling images created during the deployment
            docker image prune -f
