name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    name: Validate application and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: employee_lending_ci
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d employee_lending_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci_user:ci_password@127.0.0.1:5432/employee_lending_ci?schema=public
      APP_URL: http://localhost:3000

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Apply migrations to isolated database
        run: npm run prisma:deploy

      - name: Verify migration status
        run: npm run prisma:status

      - name: Install PostgreSQL 17 client tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /tmp/postgresql.asc
          sudo gpg --dearmor --yes --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg /tmp/postgresql.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Verify database disaster recovery
        env:
          DATABASE_ADMIN_URL: ${{ env.DATABASE_URL }}
        run: npm run dr:verify

      - name: Run application tests
        run: npm test

      - name: Run Solidity contract tests
        run: npm run test:contracts

      - name: Build production application
        run: npm run build

  local-chain:
    name: Validate local-chain integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: employee_lending_chain_ci
          POSTGRES_USER: chain_ci_user
          POSTGRES_PASSWORD: chain_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chain_ci_user -d employee_lending_chain_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://chain_ci_user:chain_ci_password@127.0.0.1:5432/employee_lending_chain_ci?schema=public
      APP_URL: http://localhost:3000

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Run isolated local-chain lifecycle
        run: npm run chain:test
