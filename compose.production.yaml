name: p2p-lending

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - internal

  migrate:
    build:
      context: .
      target: migrator
    profiles: ["tools"]
    env_file:
      - ${APP_ENV_FILE:-deploy/.env.production}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@database:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
    depends_on:
      database:
        condition: service_healthy
    networks:
      - internal

  app:
    image: qastfund-app:${APP_IMAGE_TAG:-current}
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_CIRCLE_CLIENT_KEY: ${NEXT_PUBLIC_CIRCLE_CLIENT_KEY:-}
        NEXT_PUBLIC_CIRCLE_CLIENT_URL: ${NEXT_PUBLIC_CIRCLE_CLIENT_URL:-}
        NEXT_PUBLIC_ARC_LENDING_CONTRACT_ADDRESS: ${NEXT_PUBLIC_ARC_LENDING_CONTRACT_ADDRESS:-}
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-deploy/.env.production}
    environment:
      DEPLOYMENT_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@database:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
      HOSTNAME: 0.0.0.0
      PORT: 3000
    depends_on:
      database:
        condition: service_healthy
    stop_grace_period: 30s
    networks:
      - internal
      - web

  reconciliation-scheduler:
    image: qastfund-reconciliation-scheduler:${APP_IMAGE_TAG:-current}
    build:
      context: .
      target: reconciliation-scheduler
    restart: unless-stopped
    environment:
      ARC_RECONCILIATION_CRON_SECRET: ${ARC_RECONCILIATION_CRON_SECRET:?ARC_RECONCILIATION_CRON_SECRET is required}
      ARC_RECONCILIATION_INTERVAL_SECONDS: ${ARC_RECONCILIATION_INTERVAL_SECONDS:-60}
      ARC_RECONCILIATION_SCHEDULER_URL: http://app:3000/api/internal/arc-reconciliation
      ERP_NEXT_SYNC_ENABLED: ${ERP_NEXT_SYNC_ENABLED:-false}
      ERP_NEXT_SYNC_CRON_SECRET: ${ERP_NEXT_SYNC_CRON_SECRET:-}
      ERP_NEXT_SYNC_INTERVAL_MINUTES: ${ERP_NEXT_SYNC_INTERVAL_MINUTES:-1440}
      ERP_NEXT_SYNC_SCHEDULER_URL: http://app:3000/api/internal/erpnext-sync
      REPAYMENT_OPERATIONS_CRON_SECRET: ${REPAYMENT_OPERATIONS_CRON_SECRET:-}
      REPAYMENT_OPERATIONS_INTERVAL_MINUTES: ${REPAYMENT_OPERATIONS_INTERVAL_MINUTES:-60}
      REPAYMENT_AGENT_CRON_SECRET: ${REPAYMENT_AGENT_CRON_SECRET:-}
      REPAYMENT_AGENT_INTERVAL_MINUTES: ${REPAYMENT_AGENT_INTERVAL_MINUTES:-60}
      OBSERVABILITY_FAILURE_ALERT_THRESHOLD: ${OBSERVABILITY_FAILURE_ALERT_THRESHOLD:-3}
      OPERATIONAL_ALERT_WEBHOOK_URL: ${OPERATIONAL_ALERT_WEBHOOK_URL:-}
      OPERATIONAL_ALERT_WEBHOOK_BEARER_TOKEN: ${OPERATIONAL_ALERT_WEBHOOK_BEARER_TOKEN:-}
    depends_on:
      app:
        condition: service_healthy
    stop_grace_period: 30s
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - web

networks:
  internal:
    internal: true
  web:

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
